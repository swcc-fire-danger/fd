name: Prepare
description: Get the private code (scripts + settings data) and set up Python

inputs:
  code-key:
    description: Read-only deploy key for swcc-fire-danger/code
    required: true

runs:
  using: composite
  steps:
    - name: Get the private code
      uses: actions/checkout@v4
      with:
        repository: swcc-fire-danger/code
        ssh-key: ${{ inputs.code-key }}
        path: _code

    - name: Put scripts and settings in place
      shell: bash
      run: |
        mkdir -p scripts data
        cp -r _code/scripts/. scripts/
        cp -r _code/data/. data/
        rm -rf _code

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Install packages
      shell: bash
      run: pip install -r scripts/requirements.txt
